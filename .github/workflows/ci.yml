name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, 1.88]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --verbose
      - name: Smoke test
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          KEY="$RUNNER_TEMP/ci-key.json"
          CSV="$RUNNER_TEMP/ci.csv"
          OUT="$RUNNER_TEMP/ci-out.csv"
          cargo run -- keygen -t circit -p internal-analytics -e customer -v 1.0 -o "$KEY"
          printf 'customer_id,amount,currency\ncust-1,10.00,USD\n' > "$CSV"
          cargo run -- sql -i "$CSV" -o "$OUT" -p tests/fixtures/policy_valid.yaml -k "$KEY"
